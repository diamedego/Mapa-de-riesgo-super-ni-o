# Actualización automática de los datos que cambian en el tiempo.
# Guarda cada corrida en data/archivo/ (versionado): así se arma el histórico de la línea de tiempo del mapa.
name: Actualizar datos

on:
  schedule:
    - cron: "15 */3 * * *"   # cada 3 horas: alertas SMN
    - cron: "40 10 * * *"    # todos los días 07:40 ART: alturas de ríos INA
    - cron: "0 11 * * 1"     # lunes 08:00 ART: pronóstico de caudal GloFAS
    - cron: "0 12 6 * *"     # día 6 de cada mes: pronóstico estacional SEAS5 (sale el día 5)
    - cron: "20 8 * * *"     # 05:20 y 17:20 ART: grilla del tiempo (corridas 00 y 12 UTC de los modelos)
    - cron: "20 20 * * *"
  workflow_dispatch:
    inputs:
      tarea:
        description: "smn | ina | glofas | estacional | tiempo"
        required: true
        default: smn

permissions:
  contents: write
  id-token: write   # identidad federada con Google Cloud (Earth Engine) sin claves

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RAW_DIR: data/archivo
      MANIFEST: data/archivo/manifest_automatico.csv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingesta/requirements-actions.txt

      - run: pip install -r ingesta/requirements-actions.txt

      - name: Elegir tarea
        id: tarea
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then t="${{ inputs.tarea }}"
          else
            case "${{ github.event.schedule }}" in
              "15 */3 * * *") t=smn ;;
              "40 10 * * *")  t=ina ;;
              "0 11 * * 1")   t=glofas ;;
              "0 12 6 * *")   t=estacional ;;
              "20 8 * * *" | "20 20 * * *") t=tiempo ;;
            esac
          fi
          echo "tarea=$t" >> "$GITHUB_OUTPUT"

      - name: Grilla del tiempo (lluvia, viento y temperatura, 48 h cada 3 h y 16 días)
        if: steps.tarea.outputs.tarea == 'tiempo'
        continue-on-error: true   # una fuente caída no debe tirar la corrida ni mandar mails: se reintenta en la próxima
        run: python ingesta/tiempo_grilla.py

      - name: Alertas SMN
        if: steps.tarea.outputs.tarea == 'smn'
        run: |
          python ingesta/smn_alertas.py || echo "::warning::El SMN no respondió bien; se reintenta en 3 horas"
          python web/exportar_alertas.py || echo "::warning::No se pudieron exportar las alertas; se reintenta en 3 horas"

      - name: Identidad en Google Cloud para Earth Engine (cuenta de servicio, sin claves)
        id: google
        if: steps.tarea.outputs.tarea == 'smn' || steps.tarea.outputs.tarea == 'tiempo'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/994958423059/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: mapa-nino-actions@camisetas-de-futbol-argentino.iam.gserviceaccount.com

      - name: Agua de hoy vista por radar (Sentinel-1; el mapa de Earth Engine vence a las horas)
        if: steps.tarea.outputs.tarea == 'smn' || steps.tarea.outputs.tarea == 'tiempo'
        continue-on-error: true
        # El resultado queda en data/archivo/diagnostico/ (se sube con los datos): así se ve el error sin entrar a GitHub
        run: |
          set +e   # que un error quede escrito en el diagnóstico en vez de cortar el paso
          mkdir -p data/archivo/diagnostico
          { echo "corrida $(date -u +%F\ %H:%M) UTC · identidad Google: ${{ steps.google.outcome }} · credenciales: ${GOOGLE_APPLICATION_CREDENTIALS:+sí}"
            python earth_engine/agua_hoy_radar.py 2>&1 | tail -25; echo "salida: ${PIPESTATUS[0]}"; } > data/archivo/diagnostico/radar.txt

      - name: Riesgo de hoy y de los próximos 14 días (ensamble ECMWF, GloFAS, alturas INA y alertas SMN)
        if: steps.tarea.outputs.tarea == 'tiempo'
        continue-on-error: true
        run: |
          set +e   # que un error quede escrito en el diagnóstico en vez de cortar el paso
          mkdir -p data/archivo/diagnostico
          { echo "corrida $(date -u +%F\ %H:%M) UTC"; python modelos/riesgo_diario.py 2>&1 | grep -av "%|" | tail -25; echo "salida: ${PIPESTATUS[0]}"; } > data/archivo/diagnostico/riesgo_diario.txt

      - name: Pronóstico de lluvia a 16 días (ECMWF)
        if: steps.tarea.outputs.tarea == 'ina'
        continue-on-error: true
        run: python ingesta/pronostico_corto.py

      - name: Alturas INA (últimos 10 días)
        if: steps.tarea.outputs.tarea == 'ina' || steps.tarea.outputs.tarea == 'glofas'
        run: |
          export INA_DESDE=$(date -u -d '10 days ago' +%F) INA_SALIDA_FECHADA=1
          python ingesta/ina_rios.py || echo "::warning::El INA no respondió bien; se reintenta mañana"

      - name: Caudales GloFAS
        if: steps.tarea.outputs.tarea == 'glofas'
        continue-on-error: true
        run: python ingesta/glofas_rios.py

      - name: Pronóstico estacional SEAS5
        if: steps.tarea.outputs.tarea == 'estacional'
        continue-on-error: true
        run: |
          python ingesta/open_meteo_estacional.py gobiernos_locales
          python ingesta/open_meteo_estacional.py departamentos

      - name: Recalcular riesgo (retroalimentación con lo observado y los pronósticos nuevos)
        if: steps.tarea.outputs.tarea == 'ina' || steps.tarea.outputs.tarea == 'glofas' || steps.tarea.outputs.tarea == 'estacional'
        run: |
          python modelos/rios.py pronostico
          python modelos/verificacion.py
          python modelos/indice_riesgo.py
          python web/actualizar_datos_web.py

      - name: Guardar en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/archivo data/gold web/datos/riesgo.json web/datos/estaciones.geojson web/datos/resumen.json web/datos/tiempo.json web/datos/alertas.geojson web/datos/lluvia_estacional.json web/datos/riesgo_semanal.json web/datos/radar_agua.json web/datos/riesgo_diario.json
          git diff --cached --quiet || git commit -m "Datos automáticos: ${{ steps.tarea.outputs.tarea }} $(date -u +%F\ %H:%M) UTC"
          for i in 1 2 3 4; do   # si alguien subió algo justo antes, se rebasa dando prioridad a los datos de esta corrida y se reintenta
            git pull --rebase --autostash -X theirs && git push && exit 0
            sleep $((i * 6))
          done
          echo "::warning::No se pudo subir esta corrida; la próxima la recupera"
